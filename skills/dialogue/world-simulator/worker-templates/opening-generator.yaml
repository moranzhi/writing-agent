id: opening-generator
label: 开局 · 开场白
stage: design-end
duty: >
  创作末尾：优先落库设计.开场白与开场变量；否则现写开场白；
  初值与开场同真相。不是填表工具。
when: Worker 集 accept 后、进 play 前；design_end 或 workers 声明启用时
suggested_context:
  static:
    - 设计.worker集
    - 设计.开场白与开场变量
    - 用户.需求
    - 上下文.定稿摘要
  dynamic:
    - 用户.最新输入
    - 用户.worker答复
    - 运行.初始变量
    - 输出.开场白
suggested_outputs:
  - 输出.开场白
  - 运行.初始变量
  - 变量.当前
prompt_excerpt: |
  若有设计.开场白与开场变量：落库开场白全文与开场变量，遵守正文组成版式；保留字面 @玩家。
  若无：现写开场（正文须含 @玩家），表与开场同真相。禁止先填表再糊开场。
