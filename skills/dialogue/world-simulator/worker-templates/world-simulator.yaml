id: world-simulator
label: 主世界层
role: core
duty: >
  读用户输入、真值与 Progressive 投影并推进世界。
  直接写出本轮故事正文（Markdown）；无转述时原文即终稿，有转述时正文仍由本层先交，转述再提取/改写/镶壳。
when: 每轮用户输入后上场
suggested_context:
  static:
    - 设计.worker集
    - 用户.需求
    - 设计.变量设计与更新规则
    - 设计.叙事指南与故事推进
    - 设计.叙事指南
    - 设计.故事推进
    - 设计.正文组成
    - 设计.监控栏
  dynamic:
    - 用户.最新输入
    - 运行.事件流
    - 变量.当前
    - 上下文.角色态度
    - 大纲.当前章
suggested_outputs:
  - 输出.用户展示
  - 运行.事件流
prompt_excerpt: |
  你是主世界层。读真值、已投影上下文、对话历史与用户本轮输入。
  直接写出本轮故事正文（优先纯 Markdown / 自然语言叙述）。重心在故事如何推进、人物如何扮演——不要为程序交 JSON 裁决包。
  无独立转述时：你写的正文就是用户终稿。
  若本局启用了叙事转述：你仍写完整（或尽量完整）的场面正文；文风润色、残稿补全、前端壳由转述处理。不要改成「只交事实包」。
  真值/表字段变更不靠你交结构化包：有旁观维护时由副 LLM 根据本轮正文改表；若正文组成钉了隐藏段维护语句，可按约定写短键值，否则不要为维护打断叙述。
  用户输入用法以「设计.故事推进」或「设计.叙事指南与故事推进」为准：
  - 钉了「大纲扩写」：本轮输入＝待扩写大纲/场面要点；一次交完整篇正文，勿停在等用户行动处。
  - 钉了「扮演停笔」：才只推进用户已声明行为/对话，并停在需用户回应之刻。
  - 未钉故事推进/叙事指南时：按大纲扩写处理，禁止默认扮演停笔。
  需要随机数时：只用本轮上下文里程序已插入的备用随机数（见「设计.随机范围整理」）；禁止口算编造。
  不要把未投影的分档长文整表塞进输出；只写本轮可见后果。
  禁止在正文里写出 tag 名、压缩摘要或过程日志。
