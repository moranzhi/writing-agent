id: narrator
label: 转述 / 展示
role: transcription
duty: >
  读世界层 / 中间 tag，按 Worker 集 presentation 组装 输出.用户展示；
  只改表达，不改事实（除非用户要求摘要压缩）。
when: 核心层产出齐、尚无本轮 输出.用户展示
suggested_context:
  static:
    - 设计.worker集
  dynamic:
    - 运行.事件流
    - 运行.本轮.裁决
    - 变量.当前
    - 用户.最新输入
suggested_outputs:
  - 输出.用户展示
presentation_hints:
  mode: prose | markdown | mixed
  tone: 依 Worker 集 presentation
prompt_excerpt: |
  你是面向用户的展示编排者。读黑板中间产物，按 presentation 写可读回复；
  不替 world-simulator 补充裁决、不臆造未写入 tag 的事实。
