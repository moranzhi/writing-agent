# 世界模拟器 · 配方
# 写方法论：适用、核心思路、设计流程、原则。
# 各技能何时用 / 不用 → 读技能 meta（编排器会注入），勿在此重复。
# steps = 近期起点，不是固定全程 DAG。

when: 回合互动、世界推进、角色扮演、沉浸推演类体验

core: >-
  先钉清用户如何参与、正文如何呈现、核心体验与禁忌；
  再按缺口增量写出上下文，并标明挂哪些固定槽（默认：主世界层裁决 + 叙事转述）；
  挂载归属可早定，插入顺序必须晚定——收成前用「上下文投影排序」按各块概括排出数字序与双锚点投影；
  再细化终稿收成运行规格。不发明执行单元、不为表/百科再拆槽。

process:
  - 开始通常先做「美学纲领与交互范式」，确认站位、轮转与要反复感受到什么。
  - 体验契约稍清后即可确认游玩槽（「游玩拓扑」或按默认：主世界层 + 叙事转述，角色视角默认关）；此后写上下文时只标挂谁，不标最终顺序。
  - 对照技能池「何时用 / 何时不用」，只排近期缺的 1～4 步；不预设固定长链。
  - 中段软顺序：机制/舞台支点 → 要不要真值 → 有门控再排变量与分档/事件 → 叙事/正文组成/监控栏按需；每块产物带 mount（挂哪些槽）与可选「稳/变」信号，勿写死 order。
  - 用户看见的版式用「正文组成」（非程序报文）；会变信息用「设计监控栏」（忌姓名性别等死字段）。
  - 需要可引用舞台时用「舞台骨架」；识别体验支点用实现机制；同类内容难稳定生成用生成规则，需预生成再排具体实例。
  - 需要门控/分档/程序事件：先「变量设计与更新规则」，再「变量控制上下文」。变量与 Progressive 不是执行单元。
  - 挂载归属（非顺序）：世界/机制/生成 → 主世界层；叙事指南与故事推进 → 叙事转述（推进兼挂主世界层）；美学进常驻。勿为世界观或性格表另开槽。拓扑图谱在固定槽已够用时通常跳过。
  - 需要把美学「感觉」落成遣词/笔墨焦点/禁忌与推进时用「叙事指南与故事推进」；事件表 schema 仍用生成规则，真值门控用变量设计。
  - 收成链（顺序固定）：上游上下文大致齐 →「上下文投影排序」→「细化终稿」→ status: closed。禁止在排序步发明 ref 或重写长文。
  - 进游玩前可排「开场白与开场变量」（遵循正文组成/叙事/变量）；再由 opening-generator 落库到输出.开场白与运行.初始变量。
  - 变量：真值 + Data 映射索引（实例表在具体实例）+ 维护语句（裁决包/隐藏段，非 chance）+ 旁观汇总挂载（变量控制上下文）。

principles:
  - 正推：体验 → 缺口 → 技能；禁止题材默认全选世界模拟套件。
  - 技能选型以技能 meta 为准；本配方不代替各技能写调用条件。
  - 禁止自由发明执行单元；只用固定槽（主世界层 / 叙事转述 / 可选角色视角 / 可选机遇裁定）。
  - 默认少槽：主世界层 + 叙事转述；仅强信息隔离才开角色视角；骰子/抽签/比点开机遇裁定（按需程序工具，不进每轮）。
  - 挂谁可早、排第几须晚：插入序与投影位只由「上下文投影排序」产出；中段技能禁止抢写最终 order。
  - 投影序扁平：「对话.历史」按 projection 动态裁剪；少变靠前、易变靠后是软规则，不是硬分区。
  - 真值 / Data / Progressive 三分；派生性格与章细纲不落可写真值（见 progressive-data-design）。
  - 有编排参数的步骤必须在进执行前钉齐 params（askUser 选项+其它），禁止空壳进 design-step。
  - 同技能可反复编入（不同 step.id + params）；已验收步骤不得删除。
  - 轻设定或用户明确不要世界骨架时，跳过不必要的世界/机制步骤。
  - 百科与查表归主世界层；裁决归主世界层、可见正文归叙事转述。

brief: 世界模拟类：体验→挂槽写上下文→晚排序投影→收成运行规格

steps:
  - id: 美学纲领与交互范式
    name: 美学纲领与交互范式
    depends_on: []
