# 世界模拟器 · 配方
# 写方法论：适用、核心思路、设计流程、原则。
# 各技能何时用 / 不用 → 读技能 meta（编排器会注入），勿在此重复。
# steps = 开局起点；选中本配方时程序写入「设计.创作流程」，开局即坐在第一步。

when: 回合互动、世界推进、角色扮演、沉浸推演类体验

core: >-
  先钉清用户如何参与、正文如何呈现、核心体验与禁忌（美学卡上用户会在意的部分）；
  再按那些承诺选出要兑现的上下文技能，并标明挂哪些固定槽（默认：只开主世界层，直接交可见原文；转述可选）；
  挂载归属可早定，插入顺序必须晚定——收成前用「上下文投影排序」按各块概括排出数字序与双锚点投影；
  再细化终稿收成运行规格。执行单元只用固定槽（主世界层必开 / 叙事转述默认关 / 可选角色视角；旁观按变量需要），不为表/百科再拆槽，不开机遇裁定槽。

process:
  - 开始通常先做「美学纲领与交互范式」。
  - 读美学卡上用户会在意的部分，对照【能力 · 可选工序】的何时用 / 何时不用，把兑现那些承诺所需的节点写进 steps（需要几步排几步）。各技能调用条件以 meta 为准，本表不重复。
  - 世界模拟默认槽：仅主世界层（转述关、旁观关、视角关）。能吃默认则不必排「游玩拓扑」。要独立文风层再开转述；有变量/表再开旁观。
  - 中段按承诺写上下文；每块只标挂谁（mount）与稳/变，order 留给「上下文投影排序」。挂载归属：世界/机制/生成/叙事指南 → 主世界层（无转述时叙事也挂主世界层）；开了转述则叙事指南可挂转述；美学进常驻。
  - 「回复呈现」几乎都排：先钉每轮看什么。有检定/对抗/掷骰则排「随机范围整理」收范围表。二者都在「正文组成」之前；正文组成把清单（及隐藏备用随机区）展示出来，开场白之前。
  - 收成链顺序固定：上游上下文大致齐 →「回复呈现」→（若有随机）「随机范围整理」→「正文组成」→「上下文投影排序」→「细化终稿」→ 需要开场则「开场白与开场变量」（〔收口〕）。选定开场后结束创作并保存。

principles:
  - 正推：美学卡上用户会在意的部分 → 缺口 → 技能。同一题材换核就换图，不按题材套世界模拟全套。
  - 技能选型以技能 meta 为准；本配方不代替各技能写调用条件。
  - 执行单元只用固定槽（主世界层 / 可选叙事转述 / 可选角色视角；旁观按需）。不开机遇裁定；真随机＝随机范围整理 + 程序插备用数。
  - 默认少槽：只开主世界层；转述默认关（主世界层原文即终稿）；有变量/表开旁观；仅强信息隔离才开角色视角。
  - 挂谁可早、排第几须晚：插入序与投影位只由「上下文投影排序」产出；中段技能写 mount 与稳/变。
  - 投影序扁平：「对话.历史」按 projection 动态裁剪；少变靠前、易变靠后是软规则，不是硬分区。
  - 真值 / Data / Progressive 三分；派生性格与章细纲不落可写真值。
  - 有编排参数的步骤：进执行前钉齐 params（askUser 选项+其它）；缺参时先问再进 design-step。
  - 〔可反复〕可再追加（彻底新建）；已验收 id 留在 steps。
  - 舞台骨架通常都排（备案，只分详细度）；代入后几乎不移动、只在一处待着则不排。实现机制对照其 meta。
  - 百科与查表归主世界层；可见正文默认由主世界层直接写；显式开转述时转述在主世界正文上改写/镶壳。

brief: 世界模拟类：美学卡上在意的部分→挂槽写上下文→晚排序投影→收成运行规格

steps:
  - id: 美学纲领与交互范式
    name: 美学纲领与交互范式
    depends_on: []
