# 世界模拟器 · 配方
# 写方法论：适用、核心思路、设计流程、原则。
# 各能力何时用 / 不用 → 读能力 meta（编排器会注入），勿在此重复。
# steps = 近期起点，不是固定全程 DAG。

when: 回合互动、世界推进、角色扮演、沉浸推演类体验

core: >-
  先钉清用户如何参与、正文如何呈现、核心体验与禁忌；
  再从体验反推：世界舞台、支撑机制、可生成内容、呈现与执行单元还缺什么；
  按缺口增量设计，最终收成可调度的运行规格（Worker 集），而不是一次性堆满设定百科。

process:
  - 开始通常先做「美学纲领与交互范式」，确认站位、轮转与要反复感受到什么。
  - 之后对照能力池的「何时用 / 何时不用」，只排近期真正缺的 1～4 步；不预设固定长链。
  - 需要可引用舞台时用世界蓝图；需要识别体验支点时用实现机制；同类内容难稳定生成时用生成规则，需预生成时再排具体实例。
  - 呈现、变量、拓扑、叙事等仅在体验真需要时再选。
  - 游玩期执行结构清楚后，钉 Worker 规格并细化终稿；收成前将流程 status 设为 closed。

principles:
  - 正推：体验 → 缺口 → 能力；禁止题材默认全选世界模拟套件。
  - 能力选型以能力 meta 为准；本配方不代替各能力写调用条件。
  - 有编排参数的步骤必须在进执行前钉齐 params（askUser 选项+其它），禁止空壳进 design-step。
  - 同能力可反复编入（不同 step.id + params）；已验收步骤不得删除。
  - 轻设定或用户明确不要世界骨架时，跳过不必要的世界/机制步骤。

brief: 世界模拟类：先定体验与轮转，再按缺口增量落到可运行规格

steps:
  - id: 美学纲领与交互范式
    name: 美学纲领与交互范式
    depends_on: []
