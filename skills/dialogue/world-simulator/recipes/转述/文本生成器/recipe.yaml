# 本局创作方案参考案例；可以与其它案例混合或被整份改写，不是固定路径。

brief: 把每次输入转成相对独立的成稿，并让范例与写法约束稳定复现

signals:
  - 用户提供范例，要求仿写、扩写或批量产出
  - 每份成稿可以独立收束，不依赖长期世界状态
  - 评价重点是成稿质量与风格复现，而非回合判定

method:
  - 区分范例中要复现的写法与只属于原文的内容，形成少量可执行约束
  - 把用户每次输入解释为本篇素材或大纲，保留明确的人、事、话与结果，再补足具体场面
  - 每份输出自行收束；只有用户明确要求跨篇承接时才混入长连续方法

tier_tendencies:
  - module_id: narrative-guide
    tier: 必须
    why: 范例的遣词、节奏和笔墨焦点需要稳定复现
  - module_id: story-progression
    tier: 必须
    why: 必须钉清输入是素材、大纲、续写还是改写要求
  - module_id: variable-design
    tier: 没有意义
    why: 独立成稿通常不需要跨篇真值；若要连续承接则按本局重新升档
  - module_id: reply-format
    tier: 有一定效果
    why: 只有成稿需要特殊分区或局部渲染时才增加价值
