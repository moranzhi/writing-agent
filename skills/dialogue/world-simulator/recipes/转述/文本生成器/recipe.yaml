# 文本生成器 · 转述进料配方
# 钉体验与设定；不写开场叙事本身。正文组成（格式）与开场白（按格式生成）见另配方或同提示分阶段。

when: >-
  按用户需求钉清要写什么、给谁看、气质与禁忌；
  不要世界推演、不要跨轮状态机、不要把聊天确认段当成开场白

core: >-
  产物落需求与文风类上下文；默认无变量、无旁观、无主世界层。
  「正文」指展示格式（设计.正文组成），不是开场白；开场白按格式另生成。

process:
  - 听用户说清要写什么与交付形态；写入需求/文风等设定产物。
  - 缺关键信息就问；不要问卷式盘问。
  - 不要去搭世界模拟、变量、舞台骨架。
  - 不要把整章叙事只留在聊天确认段里。

principles:
  - 正推文本交付规格，勿套世界模拟全套。
  - 保留用户原意，少二次创作。
  - 格式与开场白分清：正文组成≠开场白。

brief: 文本生成：钉需求与文风（正文格式 / 开场白另步）

steps: []
