# 文本生成器 · Boss 直聘进料配方
# 创作期写出游玩要用的固定上下文；成文在游玩：主世界出正文，转述出文风/壳。

when: >-
  用户要短篇/短文批量，且要强模仿给定范例；
  篇与篇不必剧情承接；成文走游玩管线（主世界 + 叙事转述）

core: >-
  创作进料必须 insert 齐游玩上下文：模仿范例、模仿要点、叙事指南（大纲扩写）、可选轻量需求。
  落档只挂载这些创作期产物，不另造用法。开玩后主世界写故事正文（Markdown），转述按范例改写/镶壳。
  刚需开转述；用户输入用法以创作期叙事指南为准。

process:
  - 要齐：① insert 设计.模仿范例；② insert 设计.模仿要点（用户点名要学的面）。缺则问这两项。
  - 必 insert 设计.叙事指南与故事推进（创作期产物，开玩直接挂载）。正文至少写清：
    「用户输入用法：大纲扩写。本轮输入＝短文大纲/场面要点；一次成完整篇并收束。禁止扮演停笔、禁止等用户行动。主世界交故事正文；有转述时转述负责文风与呈现，可补残稿但不改剧情。」
  - 可选 insert 用户.需求（题材/禁忌/篇幅）。
  - 齐料清单缺叙事指南 / 范例 / 要点任一 → 先补 insert，不要说可以开玩。
  - 材料齐了：告知「可以落档/开玩」；禁止在创作期写成稿短文。
  - 开玩：用户本轮＝本篇大纲；读创作期已挂上下文推进。对话一长 clear_dialogue，留产物。

principles:
  - 游玩只消费创作期产物；用法/文风/模仿面都在 insert 里，不靠落档程序补种。
  - 创作≠生产：创作收上下文；生产在游玩。
  - 分工：主世界 = 故事正文；转述 = 文风/壳（对照范例+要点；可补残稿）。
  - 输入用法由创作期叙事指南钉死为大纲扩写。
  - 一篇一世界；少问约束；无 declare_variable。

brief: 文本生成：创作期钉范例+要点+大纲扩写指南 → 开玩挂载成文

