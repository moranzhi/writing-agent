# 正文组成 · 转述进料配方
# 只钉「怎么给用户看」的格式；开场白按此格式另生成。

when: >-
  已大致知道要什么体验，需要定版式：选壳、分区、各区职责；
  或用户在谈呈现/版式/要不要选项坞/监控栏

core: >-
  写入设计.正文组成（格式契约）。
  这不是开场白、不是故事正文；开场白必须按本格式的可见块生成。

process:
  - 对照设定产物，选 shell_id（文本沉浸默认 prose）。
  - 写可见块挂到壳区域（至少 body）。
  - 需要时写微调（tone_chrome、block_labels、是否显示建议行动）。
  - 用户要第一幕时：再按本格式生成设计.开场白（内容），勿把格式 JSON 当开场白展示。

principles:
  - 格式权威在设计.正文组成；开场白服从格式。
  - 不重议文风遣词（归叙事/需求）；本步只交展示契约。
  - 产物自洽：只读设计.正文组成就能知道开场/每轮终稿怎么灌数。

brief: 正文组成：钉呈现壳与可见块（格式）→ 开场白按格式生成

steps: []
