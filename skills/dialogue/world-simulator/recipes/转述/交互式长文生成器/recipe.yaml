# 交互式长文生成器 · 对话落盘配方
# 原「文本生成器」长文路径；多轮互动钉规格，再生成连贯长文。

when: >-
  用户要写较长、可分段推进的正文（章段、连载向、润色扩写）；
  需要多轮确认需求/文风/结构；不要世界推演、不要跨轮数值状态机

core: >-
  把用户原话收成可生成长文的规格：需求、文风、结构与禁忌用 insert。
  默认无变量、无旁观、无主世界层。正文格式（设计.正文组成）与开场白按需另钉。

process:
  - 听清写什么、给谁看、气质与禁忌 → insert 用户.需求 / 设计.文风 等（order 偏小）。本轮材料已够时可同轮多落；缺关键信息就问一句。
  - 需要版式 → insert 设计.正文组成；要开篇样例 → 按格式 insert 设计.开场白。上游已齐时可与上列同轮一并落。
  - 不要搭跑团数值、舞台骨架、declare_variable。
  - 长章叙事落产物，不要只留在聊天确认段。

principles:
  - 正推长文交付规格，勿套数据化跑团。
  - 保留用户原意；规格只走 toolcall。
  - 格式与开场白分清：正文组成 ≠ 开场白。

brief: 交互式长文：多轮钉需求与文风 → 可分段生成

