# 本局创作方案参考案例；可以与硬机制等案例混合，不以有无变量作区分。

brief: 让多轮生成共享长连续，在章节与段落推进中守住事实、人物弧线和未决承诺

signals:
  - 用户要章段、连载或持续多轮推进的长正文
  - 后文必须承接早先事实、伏笔、人物变化与章节目标
  - 用户会在生成过程中改方向、局部重写或控制节奏

method:
  - 把长期承诺与本段目标分开：稳定保存不能漂移的事实，同时允许当前段落灵活改写
  - 用少而承重的变量或动态表维护连续性；变量可以存在，但不必形成硬判定系统
  - 每轮既推进当前章段，也更新仍对后文有价值的关系、伏笔和未决事项
  - 若成功失败、阈值或资源消耗需要可核对裁决，同时混入数据化跑团案例

tier_tendencies:
  - module_id: story-progression
    tier: 必须
    why: 要钉清每轮如何承接、推进、停笔和接受用户改向
  - module_id: narrative-guide
    tier: 有必要
    why: 长文本需要跨段稳定的遣词、节奏与笔墨焦点
  - module_id: variable-design
    tier: 有必要
    why: 变量或动态表可维护人物变化、伏笔和未决事项，但不必天然数值化
  - module_id: mechanism
    tier: 有一定效果
    why: 只有本局存在需要一致裁决的硬规则时才升档
