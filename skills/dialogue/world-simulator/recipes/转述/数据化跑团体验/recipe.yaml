# 数据化跑团体验 · Boss 直聘进料配方
# 注入转述总助手「本局配方」；不种节点 DAG。

when: >-
  用户要回合制角色扮演 / 沉浸推演，且体验靠跨轮数值或阶段推进
  （好感、资源、章节、地点、任务阶段等）；按值换态度、大纲或场景文案

core: >-
  把用户原话收成可开玩规格：设定类 insert；跨轮状态 declare_variable；
  阈值→文案 declare_map。作用对象是本局黑板；开玩后由主世界层读投影与真值写正文。
  默认只开主世界层，原文即终稿。

process:
  - 先钉站位、每轮看什么、体验核与禁忌 → insert 用户.需求 / 设计.美学 / 设计.世界设定 等（order 偏小）。缺一句关键承诺就问一句；勿问卷。
  - 必须跨轮记住的状态 → declare_variable（key、type、initial、user_visible）。只立承重字段；性格/态度长文不立成可写变量。
  - 有「到某值换一套文案」→ declare_map（field 对准真值；bands 写区间或精确值 + content；target_tag 用 上下文.* 或 大纲.*）。缺分档细节就问档位边界与每档要点，再落盘。
  - 需要版式 → insert 设计.正文组成；要第一幕 → 按该格式 insert 设计.开场白。用户本轮只谈数值则只做 D，不硬塞开场白。
  - 材料只够本配方就只做本配方；聊完一轮用自然语言短确认 + 建议下一刀补什么。

principles:
  - 承重才立真值；派生文案 = f(真值)，只走映射投影。
  - 分档正文写在 declare_map 的 bands.content；缺则问清后再 declare，不要用 insert 把整张分档表塞进设定散文。
  - 默认无独立叙事转述、无旁观；用户点名要文风层或程序盯表时再议。
  - 保留用户原意；规格只走 toolcall，聊天只确认与建议。

brief: 数据化跑团：设定 + 真值 + 分档映射 → 可开玩

