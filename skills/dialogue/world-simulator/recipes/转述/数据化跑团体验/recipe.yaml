# 本局创作方案参考案例；可以与长连续等案例混合，不以篇幅长短作区分。

brief: 用硬判断机制和结构化状态让选择、资源与后果可核对地持续生效

signals:
  - 用户在意成功失败、资源消耗、阈值、检定或明确触发条件
  - 状态必须跨轮保持真值，不能只靠叙事语气近似表达
  - 表格或数值的变化本身会改变可做选择、世界反应或结局

method:
  - 只把会参与判断的事实结构化，明确真值、写入者、变化条件和冲突时的裁决来源
  - 把规则结果转成世界中的可感后果；数值服务体验，不用数字替代叙事
  - 长短与连续性另行决定；长连续跑团可同时引用交互式长文案例

tier_tendencies:
  - module_id: mechanism
    tier: 必须
    why: 硬判断需要可重复执行且结果一致的规则
  - module_id: variable-design
    tier: 必须
    why: 参与判断的状态必须有真值、更新条件和维护方式
  - module_id: story-progression
    tier: 有必要
    why: 需要说明用户输入怎样触发判断，以及何时停下等待选择
  - module_id: topology
    tier: 有一定效果
    why: 只有升级、地图或关系本身构成可计算结构时才增加价值
