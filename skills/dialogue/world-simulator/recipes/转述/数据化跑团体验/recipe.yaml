# 数据化跑团体验 · 对话落盘配方
# 注入转述总助手「本局配方」；不种节点 DAG。
# 名字带「数据化」，内核仍是 AIRP / 交互式小说。
# 各能力何时落盘 → 系统提示【能力 · 何时落盘】（modules meta）；本配方只给顺序骨架。

when: >-
  用户要回合制角色扮演、沉浸推演或交互式小说（AIRP / IF）；
  在普通设定之外，还可能需要跨轮记住少量状态，或按阈值换态度/大纲/场景文案

core: >-
  理论上总是先设计美学纲领与体验核心，用来锚定「用户会在意什么」；
  再按需用核心规则（实现机制）钉下那套特殊故事设计；然后才往外兑现舞台、
  叙事、真值、映射、版式与开场。作用对象是本局黑板；开玩后主世界层读投影与
  真值写正文，默认只开主世界层、原文即终稿。
  具体能不能落：对照【能力 · 何时落盘】的何时用 / 何时不用；本配方不重复罗列。

process:
  - 每轮对照【能力 · 何时落盘】与已有产物：凡「何时用」已成立的可同轮多次 insert / declare_*；条件含糊或未到 → 本轮不落该能力，短确认或问挡住的 1 点。不抢跑未齐条件的下游。
  - 【骨架序 · 1】美学纲领与体验核心（能力表里通常总是先做）→ insert 设计.美学纲领与交互范式。模糊则细化；不确定则询问。未锚定前不建议下游。
  - 【骨架序 · 2】实现机制（仅当能力「何时用」成立：有拿掉就换骨架的变造法则）→ insert 设计.实现机制。何时不用成立则跳过，不追问要不要加规则。
  - 【骨架序 · 3+】其余能力（主角设定、舞台、生成规则、叙事、变量、回复呈现、正文组成、开场白…）各自对照何时用再落；变量走 declare_variable / declare_map。本轮材料已够且条件齐的可一并落。
    用户代入且有名字/身份/金手指时落主角设定（insert 设计.主角设定）。
  - 聊完一轮：按 reply_module 分段确认本轮所落模块 + 建议「条件已近」的下一刀（勿推荐尚未满足何时用的能力）。

principles:
  - 锚定优先：美学不定稳，不做下游；完善设定时不要忘掉核心体验。
  - 何时落盘以能力 meta 为准；配方顺序是骨架，不是许可抢跑。
  - 正推：美学卡上用户会在意的部分 → 缺口 → 再落对应产物；换核就换补什么。
  - 承重才立真值；派生文案 = f(真值)，只走映射。真值是兑现体验的加层，不是主戏。
  - 默认无独立叙事转述、无旁观；用户点名再议。
  - 保留用户原意；规格只走 toolcall。

brief: 美学锚定 → 按需机制 → 对照能力何时落盘再兑现；可选真值+映射

