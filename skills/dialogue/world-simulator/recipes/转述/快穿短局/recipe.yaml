# 本局创作方案参考案例；可以与其它案例混合或被整份改写，不是固定路径。

brief: 用一个立刻生效的体验核形成短反馈环，让少量材料尽快变成可玩的局面

signals:
  - 用户要一次性副本、单钩子情景、短任务或快穿小世界
  - 乐趣集中在一个处境、关系或变造法则，删掉它整局就失去意义
  - 用户希望快速进入局面，而不是先建设可长期经营的广阔世界

method:
  - 把最承重的处境、关系或法则压成一核，其余设定只保留能让这一核马上运转的部分
  - 让每轮反馈都回到这一核；需要状态时只保留真正改变选择或后果的少量状态
  - 用户后来要求扩展经营时，可以混入长连续或硬机制案例，不把“短局”当永久限制

tier_tendencies:
  - module_id: aesthetics-interaction
    tier: 必须
    why: 必须知道短局反复兑现的核心感受和停笔边界
  - module_id: opening-setup
    tier: 必须
    why: 短局需要让体验核立即进入可玩的具体局面
  - module_id: world-blueprint
    tier: 有一定效果
    why: 只有体验核依赖换区、探索或空间选择时才需要展开
  - module_id: variable-design
    tier: 有一定效果
    why: 只有状态会跨轮改变选择或后果时才升档
