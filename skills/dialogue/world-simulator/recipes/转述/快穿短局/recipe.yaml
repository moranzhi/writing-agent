# 快穿短局 · 对话落盘配方
# 注入系统提示「本局配方」；不种节点 DAG。
# 各能力何时落盘 → 【能力 · 何时落盘】；本配方只给骨架，并覆盖「舞台/生成/拓扑」即使何时用成立也不落。

when: >-
  用户要快速代入一小段体验：快穿小世界、一次性副本、单钩子情景、短任务。
  核依赖跨轮记住时，至多两三个数字（时限、任务进度、好感）。

core: >-
  把用户原话收成可开玩的一核短局规格，写入本局黑板；开玩后主世界层读产物写正文，默认原文即终稿。
  必交：美学纲领（这一核是什么、怎么代入、轮转到哪停）。
  用户代入有名字/简介 → 写进开场白的用户角色（meta：名字+简介），不要另开主角设定。
  核是拿掉会换故事的变造法则 → 再交实现机制。
  核依赖跨轮记住 → 再 declare 至多两三个真值。核可玩 → 交开场白。
  某一能力能不能落对照【能力 · 何时落盘】。材料只够围着这一核开玩 → 收口开场白。
  用户改口要铺可经营世界 → 本局仍把已说的收成这一核，并告知完整世界用「数据化跑团体验」或工序编排「回合推演」。

process:
  - 每轮对照【能力 · 何时落盘】与已有产物：条件已成立的可同轮多落；核还糊 → 问挡住的 1 点。
  - 【1】insert 设计.美学纲领与交互范式：用用户原话写清这一核、站位、何时等用户。缺哪件问哪件。
  - 【1b】代入且有名字/简介 → 写进开场白 meta 的用户角色（名字+简介），不要单独 insert 设计.主角设定。
  - 【2】核=拿掉会换故事的变造法则（如任务失败即送走）→ insert 设计.实现机制，写短。只是身份或开场处境 → 写进开场白或主角设定，跳过机制。
  - 用户点名文风/禁忌/写法档 → insert 叙事指南。点名推进/大纲/停笔 → insert 故事推进。二者条件独立，不要因为没谈推进就不落文风。用户要分区或壳 → 回复呈现再正文组成。未点名文风与推进 → 跳过二者，开玩吃默认散文。材料已齐且条件成立时可与上列同轮一并落。
  - 核必须跨轮记住的数（时限/进度/好感，至多三个）→ declare_variable；到某值换文案再 declare_map。没有门控 → 不立真值。
  - 核已可玩 → insert 设计.开场白（须含 @玩家；第一屏只写这一核怎么开始）。
  - 舞台骨架 / 生成规则 / 拓扑即使「何时用」成立也不 insert：地点与规则折进美学核或开场白。

principles:
  - 落盘只留删掉会让「这局玩什么」变掉的内容；其余当随口补充，问一句要不要并进核，用户没要就不 insert。
  - 交得出可玩开场即停。地图、分册、生成一族 NPC 留给「数据化跑团体验」或「回合推演」。
  - 有门控才 declare 真值。
  - 默认只开主世界层；有真值时旁观由落档程序开。规格只走 toolcall。

brief: 一核短局：钉体验核 → 主角名片 → 按需一条机制/两三个数 → 开场开玩

