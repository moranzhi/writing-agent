# 对话落盘 · 本局创作方案参考案例目录（不供用户手动选择）
# id = recipes/转述/{id}/ 文件夹；本局方案可引用、混合或改写多个案例

recipes:
  - id: 快穿短局
    name: 快穿短局
    declaration: 用一个立刻生效的体验核形成短反馈环；需要时可混入长连续或硬机制
  - id: 数据化跑团体验
    name: 数据化跑团体验
    declaration: 用硬判断机制与表格/数值真值，让选择、资源和后果可核对地持续生效
  - id: 文本生成器
    name: 文本生成器
    declaration: 把每次输入转成相对独立的成稿，并稳定复现范例与写法约束
  - id: 交互式长文生成器
    name: 交互式长文生成器
    declaration: 以长连续承接事实、人物弧线和未决承诺；可有变量，也可混入硬机制
