# 转述进料 · 配方目录（与节点流程配方不共享）
# id = recipes/转述/{id}/ 文件夹；对用户展示用 name（中文）
# 选定后写入黑板 tag 创作.选用配方；转述模式不种节点 DAG

recipes:
  - id: 数据化跑团体验
    name: 数据化跑团体验
    declaration: AIRP / 交互式小说；设定为主，可选跨轮真值与分档映射
  - id: 文本生成器
    name: 文本生成器
    declaration: 创作收范例与模仿面；开玩后主世界出正文、转述出文风/壳
  - id: 交互式长文生成器
    name: 交互式长文生成器
    declaration: 多轮钉需求与文风；连贯长文/章段（无数值跑团）
  - id: 正文组成
    name: 正文组成
    declaration: 钉呈现格式（壳与分区）；开场白按该格式生成
