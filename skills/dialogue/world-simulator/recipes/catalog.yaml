# 节点流程 · 配方目录（与转述进料配方不共享）
# id = recipes/{id}/ 文件夹
# name = 固定中文名（下拉展示）
# declaration = 给人看的短说明
# recipe.yaml 写方法论：when / core / process / principles + 近期 steps
# 步骤 name 必须 ∈ modules/catalog.yaml（【能力】）
# 选定后写入黑板 tag 创作.选用配方

recipes:
  - id: world-simulator
    name: 世界模拟器
    declaration: 回合互动、世界推进、角色扮演类体验的设计方法

  - id: expand-assistant
    name: 扩写助手
    declaration: 大纲/分段写作、写手统筹、成稿向助手类体验的设计方法
