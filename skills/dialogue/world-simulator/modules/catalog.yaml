# 共用【能力】目录（modules）
# 各【导演】与编排都从这里选型。
# id = modules/{id}/ 文件夹
# name = 固定中文名（流程 JSON 的 name；同能力可多次时靠 step.id 区分）
# declaration = catalog 短声明（可被 prompt.md ```meta 覆盖）
# artifact = 执行期产物 tag（程序映射；不写进流程 JSON）
# repeatable = true 时允许同能力多次编入增量 DAG（如生成规则、具体实例）
# params = 可选；编排进 DAG 时 steps[].params 的声明（required 须在执行前钉齐）
# opening = 可选；覆盖 prompt.md 里 ```opening 默认问题（一般只写在 prompt.md）
#
# 编排选型：程序会读取各 modules/{id}/prompt.md 的 meta
# （declaration / when / when_not / boundary）注入 design-flow；勿只靠本表短声明。
#
# 标准范例：aesthetics-interaction（美学纲领与交互范式）
# 后来写能力：同结构 prompt.md（含默认问题）+ 本表一行索引
#
# 世界模拟器常用能力见下「体验→世界→机制→呈现→收成」；编排按需选用，勿默认全选。
# 流程是可变增量 DAG：勿一次排完全程；可反复调用标了 repeatable 的能力。
# 有编排参数的能力：DAG 步骤必须是带 params 的具体调用，禁止空壳进 design-step。

modules:
  # —— 体验契约 ——
  - id: aesthetics-interaction
    name: 美学纲领与交互范式
    declaration: >-
      钉清站位、正文呈现、核心体验与禁忌、何时等用户；
      询问相近故合为一步，勿拆成「交互」「美学」两步
    artifact: 设计.美学纲领与交互范式

  # —— 世界与内容 ——
  - id: world-blueprint
    name: 世界蓝图与人文地理
    declaration: >-
      当体验需要可引用的「舞台背景」时使用：钉舞台尺度、熟悉基底与变造、
      关键格局与人文地理；只细化舞台上会出现的部分，不做设定百科或纸面地图
    artifact: 设计.世界蓝图与人文地理

  - id: generation-rules
    name: 生成规则
    repeatable: true
    declaration: >-
      仅当某类内容既对游玩重要、又无法凭世界基底稳定生成时使用：
      定义严格 schema、生成约束与仅动态/仅预生成/预生成并动态三种生命周期；
      可按生成对象反复调用
    artifact: 设计.生成规则
    params:
      - key: target
        label: 生成对象
        required: true
        hint: 本轮为哪一类内容建规则；编排时 askUser 给选项+其它
      - key: rule_id
        label: 规则 id
        required: false
        hint: 建议英文 kebab-case；可执行时再最终钉死
      - key: lifecycle_intent
        label: 生命周期意图
        required: false
        hint: runtime_only | seed_only | seed_and_runtime；不明则 askUser

  - id: concrete-instances
    name: 具体实例
    repeatable: true
    declaration: >-
      执行一条要求预生成的生成规则，直接产出符合其 schema 与约束的具体实例；
      仅动态规则不调用，可按 rule_id 或批次反复调用
    artifact: 设计.具体实例
    params:
      - key: rule_id
        label: 调用规则
        required: true
        hint: 必须来自已验收生成规则中 seed_only/seed_and_runtime 的真实 rule_id；编排时给选项
      - key: batch_goal
        label: 批次目标
        required: false
        hint: 本批要锚定什么（如开局重要NPC）
      - key: count
        label: 数量
        required: false
        hint: 数字或「按规则」；contextual 时写清规模依据

  - id: narrative
    name: 叙事指南
    declaration: 世界/助手态度与体验边界（不等于文风；契约已写清的态度勿重复问卷）
    artifact: 设计.叙事指南

  # —— 机制与数据 ——
  - id: mechanism
    name: 实现机制
    declaration: >-
      当核心体验已经明确，需要识别由哪些角色、世界、关系、规则或情境切面支撑，
      并把体验落成可供后续设定工作的核心支点时使用
    artifact: 设计.实现机制

  - id: topology
    name: 拓扑图谱
    declaration: 钉 worker/表/阶段的依赖、触发与数据流向；一张图说清谁读谁写
    artifact: 设计.拓扑图谱

  - id: variable-design
    name: 变量设计与更新规则
    declaration: 钉变量字段、初值与更新时机/规则；与表副作用对齐
    artifact: 设计.变量设计与更新规则

  - id: variable-context
    name: 变量控制上下文
    declaration: 钉哪些变量如何挂进常驻上下文 / 控制生成口径（可见性与措辞）
    artifact: 设计.变量控制上下文

  # —— 呈现 ——
  - id: status-bar
    name: 设计状态栏
    declaration: 钉用户可见状态栏：字段、刷新时机、与正文如何拼装
    artifact: 设计.状态栏

  - id: reply-format
    name: 设计回复格式
    declaration: 钉单轮可见输出的结构（正文块、面板、拼接顺序），服务体验契约
    artifact: 设计.回复格式

  # —— 收成 / 钉声明（共用；世界模拟器按需） ——
  - id: worker-spec
    name: Worker 规格
    repeatable: true
    declaration: 钉一个游玩期执行单元（职责、读写、挂载）；多演员时可多次调用
    artifact: 设计.worker规格

  - id: refine
    name: 细化终稿
    declaration: 钉死关键前提、表与副作用，收成可进游玩的规格
    artifact: 设计.worker集
