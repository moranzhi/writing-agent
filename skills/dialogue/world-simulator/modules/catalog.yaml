# 共用【能力】目录（modules）
# 各【导演】与编排都从这里选型。
# id = modules/{id}/ 文件夹
# name = 固定中文名（流程 JSON 的 name；同能力可多次时靠 step.id 区分）
# declaration = catalog 短声明（可被 prompt.md ```meta 覆盖）
# artifact = 执行期产物 tag（程序映射；不写进流程 JSON）
# repeatable = true 时允许同能力多次**新建**编入增量 DAG（如生成规则、具体实例）。
# 回头修改已完成节点不是 repeatable：用户在图上点该节点重进，不要排 mode=revise。
# closer = true 时为创作终节点：选定后程序落库、关 DAG、保存定稿
# auto = true 时为程序步：不抛默认问题、不经「同意并开始」，提案后直接执行（产物仍验收）
# kind = 节点特性。缺省=普通执行步。prior-artifact=先验产物（须先定写什么；params 是规划产物，不拦执行）
# params = 可选；普通节点=编排进 DAG 时 steps[].params 的声明（required 须在执行前钉齐）
#          〔先验产物〕=规划产物字段（可提前填，空则步内钉）
# opening = 可选；覆盖 prompt.md 里 ```opening 默认问题（一般只写在 prompt.md）
#
# 编排选型：程序会读取各 modules/{id}/prompt.md 的 meta
# （declaration / when / when_not / boundary）注入 design-flow；勿只靠本表短声明。
#
# 标准范例：aesthetics-interaction（美学纲领与交互范式）
# 后来写能力：同结构 prompt.md（含默认问题）+ 本表一行索引
#
# 世界模拟器常用能力见下「体验→世界→机制→呈现→收成」；编排按需选用，勿默认全选。
# 流程是可变增量 DAG：勿一次排完全程；可反复调用标了 repeatable 的能力（每次=彻底新建）。
# 已完成节点要改：用户在图上点该节点重进（继承旧稿），不要再排一条 fresh 或 mode=revise。
# 有编排参数的普通能力：DAG 步骤必须是带 params 的具体调用，禁止空壳进 design-step。
# 〔先验产物〕例外：params 是规划产物，可空；「写什么」在步内钉。

modules:
  # —— 体验契约 ——
  - id: aesthetics-interaction
    name: 美学纲领与交互范式
    declaration: >-
      钉清站位、正文呈现、核心体验与禁忌、何时等用户；
      询问相近故合为一步，勿拆成「交互」「美学」两步
    artifact: 设计.美学纲领与交互范式

  # —— 世界与内容 ——
  - id: world-blueprint
    name: 舞台骨架
    declaration: >-
      体验需要可引用舞台时：钉尺度、基底与变造、关键舞台区，以及社会结构与世界状况；
      只细化会上台部分，不做地图百科
    artifact: 设计.舞台骨架

  - id: generation-rules
    name: 生成规则
    kind: prior-artifact
    repeatable: true
    declaration: >-
      仅当某类内容既重要又无法凭基底稳定生成时：写出规则
      （怎么描写/生成 + 产物格式 + 可选多池，池绑 JSON 字段）；可按对象反复调用
    artifact: 设计.生成规则
    params:
      - key: target
        label: 生成对象
        hint: 规划字段；编排器已知写哪一类就填。空则步内钉
      - key: rule_id
        label: 规则 id
        hint: 英文 kebab-case，须与 target 对应（女租客→female-tenants）；改对象时禁止沿用旧 id
      - key: lifecycle_intent
        label: 生命周期意图
        hint: runtime_only | seed_only | seed_and_runtime；不明则步内钉

  - id: concrete-instances
    name: 具体实例
    kind: prior-artifact
    repeatable: true
    declaration: >-
      按预生成规则原样产出实际产物；不设计、不改合同；可按 rule_id/批次反复调用
    artifact: 设计.具体实例
    params:
      - key: rule_id
        label: 调用规则
        hint: 规划字段；须来自已验收生成规则中 seed_only/seed_and_runtime 的 rule_id。空则步内钉
      - key: batch_goal
        label: 批次目标
        hint: 本批要锚定什么（如开局重要NPC）
      - key: count
        label: 数量
        hint: 同批时本批条数；规则「一次生成」为单条时忽略（本步只交 1 条）

  - id: narrative
    name: 叙事指南与故事推进
    declaration: >-
      一次钉清写法与推进（遣词/笔墨/禁忌/示范 + 故事如何往前）；
      整份双挂转述与主世界层，不为省 token 拆投影
    artifact: 设计.叙事指南与故事推进

  # —— 机制与数据 ——
  - id: mechanism
    name: 实现机制
    declaration: >-
      核心体验已明时：识别承重切面（如何支撑 / 缺失后果），产出可挂主世界层的上下文片段；
      不重定体验、不写百科或执行单元
    artifact: 设计.实现机制

  - id: topology
    name: 拓扑图谱
    declaration: 钉 worker/表/阶段的依赖、触发与数据流向；一张图说清谁读谁写
    artifact: 设计.拓扑图谱

  - id: variable-design
    name: 变量设计与更新规则
    declaration: >-
      钉真值字段、写入源（执行单元/用户/程序）、更新规则，以及按真值门控的
      side_effects（Progressive 投影）；与运行规格 tables 对齐
    artifact: 设计.变量设计与更新规则

  - id: variable-context
    name: 变量控制上下文
    declaration: >-
      钉真值与投影如何挂进主世界层等上下文：可见性、措辞、未解锁不注入
    artifact: 设计.变量控制上下文

  # —— 呈现 ——
  - id: status-bar
    name: 设计监控栏
    declaration: >-
      钉用户可见监控栏字段：只留会变、影响决策或沉浸的信息
      （主角/攻略目标/场景交互物等）；旧称设计状态栏
    artifact: 设计.监控栏

  - id: reply-format
    name: 正文组成
    declaration: >-
      基于固定呈现壳做适配微调（选 shell_id + 字段/显示名等）；
      产出壳适配单，禁止从零发明布局；旧称设计回复格式
    artifact: 设计.正文组成

  # —— 开局（创作偏晚） ——
  - id: opening-setup
    name: 开场白与开场变量
    closer: true
    declaration: >-
      创作终节点：写出 1～多条开场白并钉同真相初值；
      选定后程序落库、结束创作并保存定稿
    artifact: 设计.开场白与开场变量

  # —— 收成 / 钉声明（共用；世界模拟器按需） ——
  - id: worker-spec
    name: 游玩拓扑
    repeatable: false
    declaration: >-
      勾选固定游玩槽位（主世界层/叙事转述/可选角色视角/可选机遇裁定，或写手大纲+章节）；
      禁止自由发明执行单元
    artifact: 设计.worker规格

  - id: context-order
    name: 上下文投影排序
    repeatable: false
    auto: true
    declaration: >-
      先抄固定执行单元名册，再为每个已启用者写出扁平投影序
      （含对话.历史与 projection）；不发明槽、不重写长文、不演情节选择题
    artifact: 设计.上下文投影排序

  - id: refine
    name: 细化终稿
    declaration: >-
      按已勾选固定槽与投影排序表收成运行规格（play_slots、常驻、表副作用）；
      不发明新执行单元
    artifact: 设计.worker集
