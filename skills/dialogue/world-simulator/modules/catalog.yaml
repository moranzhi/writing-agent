# 共用【能力】目录（modules）
# 各【导演】与编排都从这里选型。
# id = modules/{id}/ 文件夹
# name = 固定中文名（流程 JSON 的 name；同能力可多次时靠 step.id 区分）
# declaration = 给人看/兜底的短声明（规划选型以 prompt.md ```meta 为准并覆盖本表）
# artifact = 执行期产物 tag（程序映射；不写进流程 JSON）
# repeatable = true 时允许同能力多次**新建**编入增量 DAG（如生成规则、具体实例）。
# 回头修改已完成节点不是 repeatable：用户在图上点该节点重进，不要排 mode=revise。
# closer = true 时为创作终节点：选定后程序落库、关 DAG、保存定稿
# auto = true 时为程序步：不抛默认问题、不经「同意并开始」，提案后直接执行（产物仍验收）
# kind = 节点特性。缺省=普通执行步。prior-artifact=先验产物（须先定写什么；params 是规划产物，不拦执行）
# intake = 可选；recipe=仅工序编排 DAG；dictate=仅对话落盘何时落盘。缺省=两族都可见
# params = 可选；普通节点=编排进 DAG 时 steps[].params 的声明（required 须在执行前钉齐）
#          〔先验产物〕=规划产物字段（可提前填，空则步内钉）
# opening = 可选；覆盖 prompt.md 里 ```opening 默认问题（一般只写在 prompt.md）
#
# 编排选型：程序读取各 modules/{id}/prompt.md 的 meta
# （declaration / when / when_not / boundary）注入 design-flow。
# when/when_not 必须是规划对照用户话与已有产物就能判定的信号；调用条件写在技能 meta，不要写进配方 process。
#
# 标准范例：aesthetics-interaction（美学纲领与交互范式）
# 后来写能力：同结构 prompt.md（含默认问题）+ 本表一行索引
#
# 世界模拟器常用能力见下「体验→世界→机制→呈现→收成」；编排按需选用，勿默认全选。
# 流程是可变增量 DAG：勿一次排完全程；可反复调用标了 repeatable 的能力（每次=彻底新建）。
# 已完成节点要改：用户在图上点该节点重进（继承旧稿），不要再排一条 fresh 或 mode=revise。
# 有编排参数的普通能力：DAG 步骤必须是带 params 的具体调用，禁止空壳进 design-step。
# 〔先验产物〕例外：params 是规划产物，可空；「写什么」在步内钉。

modules:
  # —— 体验契约 ——
  - id: aesthetics-interaction
    name: 美学纲领与交互范式
    declaration: >-
      钉清用户会在意的体验承诺：站位、反复感到什么、轮转何时停。
      询问相近故合为一步。
    artifact: 设计.美学纲领与交互范式

  - id: protagonist
    name: 主角设定
    declaration: >-
      钉清 @玩家 扮演的那个人：名字、背景、特殊设定（身份/金手指等）。
      仅当开场白 meta 不够用时才排；用户角色优先写在开场白里。
    artifact: 设计.主角设定

  # —— 世界与内容 ——
  - id: world-blueprint
    name: 舞台骨架
    declaration: >-
      本局舞台备案：划出玩家实际游玩会换区活动的主要区域并写细；
      尺度与详细度随体验变。代入后几乎不移动、只在一处待着则不排
    artifact: 设计.舞台骨架

  - id: generation-rules
    name: 生成规则
    kind: prior-artifact
    repeatable: true
    declaration: >-
      要精准格式，或本局原创导致知识中无可参考对象、或难以在无指导情况下生成足够可信内容且故事里还要生成时：写出该对象族怎么生成；
      创意字段用方向池，不堆枚举词；不填最终实例；可按对象反复
    artifact: 设计.生成规则
    params:
      - key: target
        label: 生成对象
        hint: 规划字段；编排器已知写哪一类就填。空则步内钉
      - key: rule_id
        label: 规则 id
        hint: 英文 kebab-case，须与 target 对应（女租客→female-tenants）；改对象时禁止沿用旧 id
      - key: lifecycle_intent
        label: 生命周期意图
        hint: runtime_only | seed_only | seed_and_runtime；不明则步内钉

  - id: concrete-instances
    name: 具体实例
    kind: prior-artifact
    repeatable: true
    declaration: >-
      已有预生成规则时：按该规则原样交出 records；不设计、不改合同；可按规则/批次反复
    artifact: 设计.具体实例
    params:
      - key: rule_id
        label: 调用规则
        hint: 规划字段；须来自已验收生成规则中 seed_only/seed_and_runtime 的 rule_id。空则步内钉
      - key: batch_goal
        label: 批次目标
        hint: 本批要锚定什么（如开局重要NPC）
      - key: count
        label: 数量
        hint: 同批时本批条数；规则「一次生成」为单条时忽略（本步只交 1 条）

  - id: narrative
    name: 叙事指南与故事推进
    intake: recipe
    declaration: >-
      美学已有方向时：把感觉落成可执行的遣词、笔墨落点、禁忌与推进方式；
      不重做体验问卷。工序编排用本步；对话落盘拆成「叙事指南」「故事推进」
    artifact: 设计.叙事指南与故事推进

  - id: narrative-guide
    name: 叙事指南
    intake: dictate
    declaration: >-
      美学已有方向时：把感觉落成可执行的遣词、笔墨落点、禁忌与写法档；
      不重做体验问卷，也不钉故事怎么往前
    artifact: 设计.叙事指南

  - id: story-progression
    name: 故事推进
    intake: dictate
    declaration: >-
      美学已有方向时：钉故事怎么往前、用户输入用法（大纲扩写或扮演停笔）；
      不重做文风问卷
    artifact: 设计.故事推进

  # —— 机制与数据 ——
  - id: mechanism
    name: 实现机制
    declaration: >-
      整体感觉已钉，故事里有必须当作既成事实的变造法则时：
      点出它们如何约束故事，不解释为何存在
    artifact: 设计.实现机制

  - id: topology
    name: 拓扑图谱
    declaration: >-
      必须生成、但不适合走「生成规则→具体实例」时：用拓扑结构写出来
      （升级路径、地图、人物关系等）
    artifact: 设计.拓扑图谱

  - id: variable-design
    name: 变量设计与更新规则
    declaration: >-
      体验必须跨轮记住少数状态时：钉真值、谁可写、如何变、维护语句，
      以及按值换文案的映射索引
    artifact: 设计.变量设计与更新规则

  - id: variable-context
    name: 变量控制上下文
    declaration: >-
      已有真值或映射时：钉谁看见什么（主世界层/转述/旁观）、未解锁不注入；
      无信息差则可不排
    artifact: 设计.变量控制上下文

  # —— 呈现 ——
  - id: status-bar
    name: 回复呈现
    declaration: >-
      几乎每局都要：钉每轮终稿的必选/可选区域，以及各区域的简单内容规则
      （字数、段落、选项怎么组成等）；不排版
    artifact: 设计.监控栏

  - id: random-range
    name: 随机范围整理
    declaration: >-
      上游已有检定/对抗/掷骰需求时：汇总全部要用的随机项与取值范围（含表达式），
      供程序每轮插入备用随机数；排在正文组成之前
    artifact: 设计.随机范围整理

  - id: reply-format
    name: 正文组成
    declaration: >-
      把「回复呈现」已钉的内容展示给用户：选壳、美化排版，可写 CSS/HTML/JS；
      排在回复呈现之后、开场白之前；有随机表则一并接到隐藏备用区
    artifact: 设计.正文组成

  # —— 开局（创作偏晚） ——
  - id: opening-setup
    name: 开场白与开场变量
    closer: true
    declaration: >-
      创作终节点：写出 1～多条开场（每条 = meta 用户角色 + 正文；须含字面 @玩家）并钉同真相初值；
      选定后程序落库、结束创作并保存定稿
    artifact: 设计.开场白与开场变量

  # —— 收成 / 钉声明（共用；世界模拟器按需） ——
  - id: worker-spec
    name: 游玩拓扑
    repeatable: false
    declaration: >-
      不能吃默认槽时才勾选：主世界层必开；有变量/表才开旁观；转述默认开；
      强秘密才开视角；写手则大纲+章节；禁止发明执行单元与机遇槽
    artifact: 设计.worker规格

  - id: context-order
    name: 上下文投影排序
    repeatable: false
    auto: true
    declaration: >-
      收成前给已启用槽排扁平投影序（含对话.历史）；
      不发明槽、不重写长文、不演情节选择题
    artifact: 设计.上下文投影排序

  - id: refine
    name: 细化终稿
    declaration: >-
      按已勾选槽（或默认槽）与投影排序表收成运行规格；不发明新执行单元
    artifact: 设计.worker集
